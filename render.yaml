services:

  - type: worker

    name: nuthh-tiktok-downloader

    env: python

    buildCommand: pip install -r requirements.txt

    startCommand: python bot.py

    envVars:

      - key: BOT_TOKEN
        sync: false

      - key: ADMIN_IDS
        sync: false

      - key: DATABASE_PATH
        value: /data/nuthh.db

      - key: DOWNLOAD_DIR
        value: downloads
